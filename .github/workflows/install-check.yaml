# Install imprintomeR exactly as the README says, on a clean runner, then score a small cohort.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly, to catch dependency changes

name: install-check

permissions: read-all

jobs:
  install:
    runs-on: ${{ matrix.os }}
    name: README install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install as in the README
        shell: Rscript {0}
        run: |
          ref <- Sys.getenv("GITHUB_SHA")
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          BiocManager::install(c("remotes", paste0("hongjianjin/imprintomeR@", ref)),
                               ask = FALSE, update = FALSE)

      - name: Score a small synthetic cohort
        shell: Rscript {0}
        run: |
          library(imprintomeR)
          set.seed(1)
          ps <- readRDS(system.file("extdata", "probesets_hg38.rds", package = "imprintomeR"))[["selected"]]
          p <- unique(ps$NAME)
          b <- matrix(runif(length(p) * 12, 0.4, 0.6), length(p), 12,
                      dimnames = list(p, sprintf("S%02d", 1:12)))
          meta <- data.frame(Sample_Name = colnames(b),
                             Sample_Group = rep(c("control", "case"), each = 6))
          x <- ImprintomeSet(beta = b, meta = meta, probeset = ps, genome = "hg38", assay = "EPIC")
          x <- runImprintome(x, probeset = "selected", reference_group = "control")
          res <- results(x)[[grep("^AnalyzeImprintStatus", names(results(x)))[1]]]
          stopifnot(nrow(res) == 12, all(c("IDS", "Angle", "Status") %in% names(res)))
          print(head(res[, c("Sample_Name", "IDS", "Angle", "Status")]))
