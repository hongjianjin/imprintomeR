# Install imprintomeR exactly as the README says, on a clean runner, then run the README Quick start
# and the Supplementary companion script (supplementary/Supplementary_Code.R).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly, to catch dependency changes

name: install-check

permissions: read-all

# A newer push to the same branch cancels a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ${{ matrix.os }}
    name: README install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: System libraries (Linux, as in the README)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install as in the README
        shell: Rscript {0}
        run: |
          ref <- Sys.getenv("GITHUB_SHA")
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          BiocManager::install(c("remotes", paste0("hongjianjin/imprintomeR@", ref)),
                               ask = FALSE, update = FALSE)

      - name: Install the Quick start example IDATs
        shell: Rscript {0}
        run: BiocManager::install("minfiData", ask = FALSE, update = FALSE)

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Run the README Quick start as pasted
        shell: Rscript {0}
        run: |
          readme <- readLines("src/README.md", encoding = "UTF-8")
          start <- grep("^## Quick start", readme)
          open <- grep("^```r", readme); open <- open[open > start][1]
          close <- grep("^```$", readme); close <- close[close > open][1]
          code <- readme[(open + 1):(close - 1)]
          dir.create("quickstart"); setwd("quickstart")
          writeLines(code, "quickstart.R")
          withCallingHandlers(source("quickstart.R", echo = TRUE, max.deparse.length = 300),
                              warning = function(w) stop("Quick start warning: ", conditionMessage(w)))
          stopifnot(file.exists("polar.pdf"), dir.exists("imprintome_results"), dir.exists("qc_output"))

      - name: Install the companion script's extra package (gridBase, for the circular heatmap)
        shell: Rscript {0}
        run: BiocManager::install("gridBase", ask = FALSE, update = FALSE)

      - name: Run the Supplementary companion script (Supplementary_Code.R)
        run: Rscript src/supplementary/Supplementary_Code.R supplementary_output

      - name: Check the companion script outputs
        shell: Rscript {0}
        run: |
          out <- "supplementary_output"
          stopifnot(
            file.exists(file.path(out, "qc_results")),
            file.exists(file.path(out, "reference.rds")),
            file.exists(file.path(out, "icr_heatmap.pdf")),
            file.exists(file.path(out, "plots", "circular.png")),
            length(list.files(file.path(out, "imprintome_output"), pattern = "AnalyzeImprintStatus")) >= 6
          )
