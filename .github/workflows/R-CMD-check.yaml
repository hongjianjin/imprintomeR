# R CMD check on Linux, macOS and Windows (r-lib/actions), building and running the vignettes on the bundled example data.
on:
  push:
    branches: [main]
    # Documentation-only pushes skip the check: these files are excluded from the package
    # build or not run by R CMD check. install-check (README Quick start) and pkgdown still run.
    paths-ignore:
      - 'README.md'
      - 'CITATION.cff'
      - 'tutorials/**'
      - 'vignettes/articles/**'
      - 'benchmark/**'
      - 'data-raw/**'
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A newer push to the same branch cancels a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
