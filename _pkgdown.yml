url: https://hongjianjin.github.io/imprintomeR/

template:
  bootstrap: 5

home:
  title: "imprintomeR: genomic imprinting disturbance from methylation arrays"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/imprintomeset-quickstart.html

articles:
- title: Get started
  navbar: ~
  contents:
  - imprintomeset-quickstart
  - imprintomeR-workflow-basic
- title: Guides
  navbar: Guides
  contents:
  - articles/qc
  - articles/analysis
  - articles/plots
  - imprintomeset-results-export
  - articles/probesets
  - articles/command-line
  - articles/faq
- title: Worked GEO examples
  navbar: Worked GEO examples
  desc: >
    Download, QC and analysis of public cohorts. Code is shown, not run, on this site;
    run notebooks with their outputs are in the tutorials/ folder of the GitHub repository.
  contents:
  - articles/GSE52576
  - articles/GSE240091
  - articles/GSE74738

